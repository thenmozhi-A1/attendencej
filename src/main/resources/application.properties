# Server Configuration
server.port=${PORT:8080}

# H2 In-Memory Database Configuration (Local Development fallback)
spring.datasource.url=${DB_URL:jdbc:h2:mem:attendance_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=Tm9uZUV4cGVjdGVkU2VjcmV0S2V5Rm9yQXR0ZW5kYW5jZU1hbmFnZW1lbnRTeXN0ZW1TZWNyZXQ=
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://attendence-ebon.vercel.app,${FRONTEND_URL:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# Logging
logging.level.com.attendance=INFO
logging.level.org.springframework.security=WARN

