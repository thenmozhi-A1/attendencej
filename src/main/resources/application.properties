# Server Configuration
server.port=${PORT:8080}

# Database configuration
# Default to H2 so cloud deployments can start without an external database.
# To use MySQL, set SPRING_PROFILES_ACTIVE=mysql and provide DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${H2_DB_URL:jdbc:h2:file:/tmp/attendance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${H2_DB_USERNAME:sa}
spring.datasource.password=${H2_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=Tm9uZUV4cGVjdGVkU2VjcmV0S2V5Rm9yQXR0ZW5kYW5jZU1hbmFnZW1lbnRTeXN0ZW1TZWNyZXQ=
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://attendence-ebon.vercel.app,${FRONTEND_URL:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# Logging
logging.level.com.attendance=INFO
logging.level.org.springframework.security=WARN

